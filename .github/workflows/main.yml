name: Instagram Viral Reposter

on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install apify-client moviepy requests

      - name: Run Bot
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ZERNIO_TOKEN: ${{ secrets.ZERNIO_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: python main.py

      - name: Save State
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "ViralBot"
          git add processed_videos.json
          git commit -m "Update processed videos [skip ci]" || exit 0
          git push
