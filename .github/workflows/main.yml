name: Instagram Viral Reposter

on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install apify-client moviepy requests

      - name: 1. Process Video (main.py)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python main.py

      - name: 2. Push Video to GitHub
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "ViralBot"
          git add videos/reels_upload.mp4 processed_videos.json current_author.txt
          git commit -m "Update media [skip ci]" || exit 0
          git push

      - name: 3. Wait for CDN
        run: sleep 60 # Temps vital per a que la URL sigui pública

      - name: 4. Publish to Instagram (publish.py)
        env:
          ZERNIO_TOKEN: ${{ secrets.ZERNIO_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python publish.py