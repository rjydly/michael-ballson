name: Instagram Viral Reposter

on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v3

      - name: 2. Netejar carpeta de vídeos anteriors
        run: |
          mkdir -p videos
          rm -rf videos/*
          touch videos/.gitkeep

      - name: 3. Setup Python i dependències
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 4. Instal·lar eines
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install apify-client moviepy requests

      - name: 5. FASE 1: Processar vídeo
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python main.py process

      - name: 6. Publicar vídeo al repositori (Servidor Raw)
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "ViralBot"
          git add videos/out.mp4 processed_videos.json caption_temp.txt
          git commit -m "Allotjant nou vídeo [skip ci]" || exit 0
          git push

      - name: 7. Esperar propagació (10 segons)
        run: sleep 10

      - name: 8. FASE 2: Cridar API de Zirnio
        env:
          ZERNIO_TOKEN: ${{ secrets.ZERNIO_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: python main.py publish
