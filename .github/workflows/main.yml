name: Instagram Viral Reposter

on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install apify-client moviepy requests

      - name: Process Video
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python main.py

      - name: Commit and Push Video to Repo
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "ViralBot"
          # Esborrem vídeos vells de l'historial de Git i afegim el nou
          git add videos/reels_upload.mp4 processed_videos.json
          git commit -m "Update video for posting [skip ci]" || exit 0
          git push

      - name: Wait for GitHub CDN (Molt Important)
        run: sleep 60 # Esperem 60 segons perquè la URL RAW estigui activa

      - name: Notify Zernio API
        env:
          ZERNIO_TOKEN: ${{ secrets.ZERNIO_TOKEN }}
          INSTAGRAM_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          # REVISA QUE AQUESTA URL SIGUI PÚBLICA (Entra-hi manualment per provar)
          VIDEO_URL: "https://raw.githubusercontent.com/${{ github.repository }}/main/videos/reels_upload.mp4"
          THUMB_URL: "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/thumbnail.png"
        run: |
          AUTHOR=$(cat current_author.txt)
          echo "Publicant vídeo de @$AUTHOR a Instagram..."
          
          RESPONSE=$(curl -s -X POST "https://api.zirnio.com/v1/posts" \
          -H "Authorization: Bearer $ZERNIO_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"instagram_account_id\": \"$INSTAGRAM_ID\",
            \"media_type\": \"REELS\",
            \"video_url\": \"$VIDEO_URL\",
            \"cover_url\": \"$THUMB_URL\",
            \"caption\": \"🔥 Crèdits: @$AUTHOR #reels #viral\"
          }")
          
          echo "Resposta de Zernio: $RESPONSE"
          
          # Si Zernio respon amb error, volem que el workflow falli per saber-ho
          if [[ $RESPONSE == *"error"* ]]; then
            echo "Error detectat en la publicació."
            exit 1
          fi